{{- if eq .deploymentTechnology "argocd" }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-mesh-runtime
  namespace: argocd
  labels:
    core.platform-mesh.io/operator-created: "true"
spec:
  description: Default project for platform-mesh runtime cluster
  sourceRepos:
    - '*'
  destinations:
    - namespace: {{ .releaseNamespace }}
      server: {{ .destinationServer | default "https://kubernetes.default.svc" }}
    - namespace: kube-system
      server: {{ .destinationServer | default "https://kubernetes.default.svc" }}
    - namespace: etcd-druid-system
      server: {{ .destinationServer | default "https://kubernetes.default.svc" }}
  sourceNamespaces:
    - {{ .releaseNamespace }}
{{- if and .helmReleaseNamespace (ne .helmReleaseNamespace .releaseNamespace) }}
    - {{ .helmReleaseNamespace }}
{{- end }}
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
{{- end }}
