{{- if and .gatewayApi.enabled (ne .deploymentTechnology "argocd") (not .gatewayApi.kustomization) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .gatewayApi.name }}
  namespace: {{ .helmReleaseNamespace }}
  labels:
    core.platform-mesh.io/operator-created: "true"
spec:
{{- if .kubeConfigEnabled }}
  kubeConfig:
    secretRef:
      name: {{ .kubeConfigSecretName }}
      key: {{ .kubeConfigSecretKey }}
{{- end }}
  chartRef:
    kind: OCIRepository
    name: {{ .gatewayApi.name }}
    namespace: {{ .helmReleaseNamespace }}
  dependsOn: []
  interval: {{ .gatewayApi.interval }}
  releaseName: {{ .gatewayApi.name }}
  targetNamespace: {{ .gatewayApi.targetNamespace }}
  timeout: 15m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
{{- end }}
