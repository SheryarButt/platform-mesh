apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: virtual-workspaces
  namespace: platform-mesh-system
spec:
  dnsNames:
    - frontproxy-front-proxy
    - frontproxy-front-proxy.platform-mesh-system
    - frontproxy-front-proxy.platform-mesh-system.svc.cluster.local
    - virtual-workspaces
    - virtual-workspaces.platform-mesh-system
    - virtual-workspaces.platform-mesh-system.svc.cluster.local
  duration: 8760h0m0s
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  renewBefore: 360h0m0s
  secretName: virtual-workspaces-tls
  usages:
    - server auth
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
