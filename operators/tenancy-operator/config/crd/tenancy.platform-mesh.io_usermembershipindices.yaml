---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: usermembershipindices.tenancy.platform-mesh.io
spec:
  group: tenancy.platform-mesh.io
  names:
    kind: UserMembershipIndex
    listKind: UserMembershipIndexList
    plural: usermembershipindices
    shortNames:
    - umi
    singular: usermembershipindex
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.entryCount
      name: Entries
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UserMembershipIndex is a flat list of the Tenants and Projects one User
          belongs to. One exists per User, sharing its metadata.name.

          It is a read model, so a client can list its tenants and projects without
          fanning out over the fleet. It is not consulted when a tenant talks to their
          own workspace — kcp RBAC decides that. If the two disagree, RBAC is right and
          the index needs rebuilding.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UserMembershipIndexSpec defines the desired state of a UserMembershipIndex.
            properties:
              entries:
                description: |-
                  Entries carries one row per Membership the User holds, across every Tenant
                  and Project.
                items:
                  description: |-
                    MembershipIndexEntry is one Membership the user holds, with enough Tenant and
                    Project metadata for a client to render it without extra lookups.
                  properties:
                    personal:
                      description: Personal mirrors Tenant.spec.personal.
                      type: boolean
                    projectClusterID:
                      description: |-
                        ProjectClusterID is the Project workspace's kcp logical cluster, which is
                        what a kubeconfig server URL points at. Empty on tenant-scope rows.
                      type: string
                    projectDisplayName:
                      description: |-
                        ProjectDisplayName mirrors the display name annotation on the Project's
                        kcp Workspace. Empty on tenant-scope rows.
                      type: string
                    projectUUID:
                      description: ProjectUUID is set on project-scope rows and empty
                        on tenant-scope rows.
                      type: string
                    role:
                      description: Role is the granted role.
                      enum:
                      - admin
                      - member
                      - viewer
                      type: string
                    tenantClusterID:
                      description: TenantClusterID is the Tenant workspace's kcp logical
                        cluster.
                      type: string
                    tenantCreatedAt:
                      description: TenantCreatedAt mirrors the Tenant's creationTimestamp.
                      format: date-time
                      type: string
                    tenantDisplayName:
                      description: |-
                        TenantDisplayName mirrors Tenant.spec.displayName, re-synced when it
                        changes.
                      type: string
                    tenantFirstAdmin:
                      description: |-
                        TenantFirstAdmin is the User that held the Tenant's first admin
                        Membership.
                      type: string
                    tenantUUID:
                      description: TenantUUID is the Tenant's metadata.name.
                      minLength: 1
                      type: string
                  required:
                  - role
                  - tenantUUID
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
          status:
            description: UserMembershipIndexStatus defines the observed state of a
              UserMembershipIndex.
            properties:
              entryCount:
                description: EntryCount mirrors len(spec.entries), so `kubectl get`
                  can print it.
                format: int32
                type: integer
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of this object the controller last
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
