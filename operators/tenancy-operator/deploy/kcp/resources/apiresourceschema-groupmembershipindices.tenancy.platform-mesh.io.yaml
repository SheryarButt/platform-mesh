apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v11b7bafd2527.groupmembershipindices.tenancy.platform-mesh.io
spec:
  group: tenancy.platform-mesh.io
  names:
    kind: GroupMembershipIndex
    listKind: GroupMembershipIndexList
    plural: groupmembershipindices
    shortNames:
    - gmi
    singular: groupmembershipindex
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.group
      name: Group
      type: string
    - jsonPath: .status.entryCount
      name: Entries
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: |-
        GroupMembershipIndex is the group-subject half of the read model: the Tenants
        and Projects one GROUP has been granted. One exists per group that holds at
        least one Membership.

        It answers the question a caller's token asks — "I hold these groups, what do
        they reach" — without fanning out over the fleet, which is the same job
        UserMembershipIndex does for a person. What it deliberately does NOT do is
        answer the reverse: there is no list of who is in a group, because the platform
        does not know and cannot be told. Group membership arrives in a token and
        nowhere else.

        Why this and not rows on each member's UserMembershipIndex: a group grant would
        then have to be materialized onto every member, which needs a list of members
        the platform does not have, and would leave rows behind for anyone who left the
        group until they next signed in — access that outlives its revocation. Indexing
        BY GROUP means the caller's own live token supplies the membership on every
        request, so removal at the identity provider takes effect on the next token
        with nothing to clean up.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: GroupMembershipIndexSpec defines the desired state of a GroupMembershipIndex.
          properties:
            entries:
              description: Entries carries one row per Membership granted to this
                group.
              items:
                description: |-
                  MembershipIndexEntry is one Membership the user holds, with enough Tenant and
                  Project metadata for a client to render it without extra lookups.
                properties:
                  personal:
                    description: Personal mirrors Tenant.spec.personal.
                    type: boolean
                  projectClusterID:
                    description: |-
                      ProjectClusterID is the Project workspace's kcp logical cluster, which is
                      what a kubeconfig server URL points at. Empty on tenant-scope rows.
                    type: string
                  projectDisplayName:
                    description: |-
                      ProjectDisplayName mirrors the display name annotation on the Project's
                      kcp Workspace. Empty on tenant-scope rows.
                    type: string
                  projectUUID:
                    description: ProjectUUID is set on project-scope rows and empty
                      on tenant-scope rows.
                    type: string
                  role:
                    description: Role is the granted role.
                    enum:
                    - admin
                    - member
                    - viewer
                    type: string
                  tenantClusterID:
                    description: TenantClusterID is the Tenant workspace's kcp logical
                      cluster.
                    type: string
                  tenantCreatedAt:
                    description: TenantCreatedAt mirrors the Tenant's creationTimestamp.
                    format: date-time
                    type: string
                  tenantDisplayName:
                    description: |-
                      TenantDisplayName mirrors Tenant.spec.displayName, re-synced when it
                      changes.
                    type: string
                  tenantFirstAdmin:
                    description: |-
                      TenantFirstAdmin is the User that held the Tenant's first admin
                      Membership.
                    type: string
                  tenantUUID:
                    description: TenantUUID is the Tenant's metadata.name.
                    minLength: 1
                    type: string
                required:
                - role
                - tenantUUID
                type: object
              type: array
              x-kubernetes-list-type: atomic
            group:
              description: |-
                Group is the group this index is for, as the identity provider emits it.

                Carried in the spec because metadata.name CANNOT hold it: a group name is
                whatever the issuer says, and `team-a/admins` — a shape real providers emit —
                is not a legal object name. The name is a digest of this value, so this field
                is the only readable statement of which group the object is about.
              maxLength: 253
              minLength: 1
              type: string
          required:
          - group
          type: object
        status:
          description: |-
            GroupMembershipIndexStatus defines the observed state of a
            GroupMembershipIndex.
          properties:
            entryCount:
              description: EntryCount mirrors len(spec.entries), so `kubectl get`
                can print it.
              format: int32
              type: integer
            observedGeneration:
              description: |-
                ObservedGeneration is the generation of this object the controller last
                reconciled.
              format: int64
              type: integer
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
