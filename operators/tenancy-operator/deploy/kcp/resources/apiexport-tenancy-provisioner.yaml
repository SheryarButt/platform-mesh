# tenancy-provisioner — the capability to MAKE a workspace.
#
# Deliberately declares no resources. `resources` is optional on an APIExport and
# permission claims cover resources outside the export's own schemas, so an export
# with no schemas is exactly the "grant a capability, add no API" primitive this
# needs: binding it gives a workspace zero new tenant-visible API and gives the
# platform one specific reach.
#
# A Workspace object lives in its PARENT's logical cluster, so "create workspaces
# here" belongs to exactly two tiers: the fleet root, whose children are
# Tenants, and each Tenant, whose children are the team workspaces.
# This export is bound in those two places and nowhere else.
#
# Kept separate from tenancy-access on purpose: the two most dangerous powers in
# the system — provision a workspace, versus reach inside one — are named
# separately, granted separately, and revocable separately.
#
# NOT directly appliable: __TENANCY_KCP_IO_IDENTITY_HASH__ is substituted at apply
# time by contrib/tilt/bootstrap/tenancy.sh (production: the chart). kcp rejects a
# claim on a non-built-in type without an identityHash, and `workspaces` is served
# by the root `tenancy.kcp.io` APIExport rather than being built in — so the hash
# pins this claim to THAT export's schema. It is per-kcp-install, hence resolved at
# apply time rather than committed.
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: tenancy-provisioner
spec:
  permissionClaims:
  - group: tenancy.kcp.io
    resource: workspaces
    identityHash: __TENANCY_KCP_IO_IDENTITY_HASH__
    verbs: [get, list, watch, create, delete]
status: {}
