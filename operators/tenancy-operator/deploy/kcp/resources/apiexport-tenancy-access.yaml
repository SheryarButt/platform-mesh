# tenancy-access — the capability to WRITE INSIDE a workspace.
#
# Declares no resources, so a tenant running `kubectl api-resources` in a child
# workspace sees nothing new. What changes is that the platform's reach into that
# workspace becomes declared, scoped and auditable rather than implicit: the claim
# list below IS the blast radius of a bug in this operator, and
# `kubectl get apibindings` in the workspace shows precisely what we can touch.
#
# This is the alternative to writing into child workspaces with a cluster-admin
# client, where the blast radius of the same bug is "everything".
#
# The BINDING for this export can come from the WorkspaceType's
# defaultAPIBindings: kcp's default-apibinding controller copies every claim on
# the export into the binding it creates, already Accepted and with a matchAll
# selector. (An earlier note here claimed the opposite; it was wrong, and the
# `tenant` type now relies on this.)
#
# What still needs the `workspace` initializer is the WORK behind the claim below
# — the `default` namespace has to be created, and a claim only grants permission
# to create it. That runs through the initializingworkspaces virtual workspace,
# before the workspace is servable to its tenant.
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: tenancy-access
spec:
  permissionClaims:
  # The `project` WorkspaceType omits `extend: root:universal`, so kcp does not
  # create the `default` namespace and the controller must.
  - group: ""
    resource: namespaces
    verbs: [get, list, watch, create]
  # Bot identities are plain ServiceAccounts in the child workspace's default
  # namespace — no wrapping CRD.
  - group: ""
    resource: serviceaccounts
    verbs: [get, list, watch, create, update, delete]
  # What a Membership becomes: a ClusterRoleBinding naming the user's
  # rbacIdentity. Delete verbs are load-bearing — grant that is not symmetric with
  # revoke leaves a stale binding, and a stale binding is live access.
  - group: rbac.authorization.k8s.io
    resource: clusterroles
    verbs: [get, list, watch, create, update, delete]
  - group: rbac.authorization.k8s.io
    resource: clusterrolebindings
    verbs: [get, list, watch, create, update, delete]
status: {}
