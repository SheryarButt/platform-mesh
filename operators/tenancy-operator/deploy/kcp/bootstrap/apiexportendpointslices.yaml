# One APIExportEndpointSlice per export, applied into the exports workspace.
#
# These publish the virtual workspace URLs the operator reads the fleet through:
# each --kcp-*-endpoint-slice flag names one of these. Without a slice there is no
# wildcard endpoint, and without a wildcard endpoint a controller cannot watch
# across logical clusters at all.
#
# NO `spec.export.path`, deliberately. These slices are always applied into the
# same workspace that defines the exports, and kcp reads an empty path as "this
# cluster" — which is both what we mean and the only form that works: with a path
# set, admission resolves the export through the by-path index and denies the bind
# when that lookup misses.
#
# It also makes the file layout-independent: nothing here needs to know where the
# install is rooted.
#
# `spec.export` is IMMUTABLE. A slice created against a different export cannot be
# patched onto a new one, so the installer deletes and recreates on that specific
# rejection rather than leaving a slice pointing at another install's export.
apiVersion: apis.kcp.io/v1alpha1
kind: APIExportEndpointSlice
metadata:
  name: tenancy-platform
spec:
  export:
    name: tenancy-platform
---
apiVersion: apis.kcp.io/v1alpha1
kind: APIExportEndpointSlice
metadata:
  name: tenancy
spec:
  export:
    name: tenancy
---
apiVersion: apis.kcp.io/v1alpha1
kind: APIExportEndpointSlice
metadata:
  name: tenancy-provisioner
spec:
  export:
    name: tenancy-provisioner
---
apiVersion: apis.kcp.io/v1alpha1
kind: APIExportEndpointSlice
metadata:
  name: tenancy-access
spec:
  export:
    name: tenancy-access
