# The two tenant WorkspaceTypes. Applied once, at install, into the exports
# workspace (default root:system:controllers) alongside the APIExports.
#
# These carry the model's invariants down into kcp, so they hold whatever a client
# does rather than because a component remembered to check.
#
# NOT directly appliable: __EXPORTS_REF__ is substituted at apply time. A
# WorkspaceType reference is a (name, path) pair, so hardcoding the path would
# break a sub-tree install and, worse, would make two installs on one kcp resolve
# each other's types.

apiVersion: tenancy.kcp.io/v1alpha1
kind: WorkspaceType
metadata:
  name: tenant
spec:
  extend:
    with:
    - name: universal
      path: root
  defaultChildWorkspaceType:
    name: project
    path: __EXPORTS_REF__
  # `tenancy` makes every Tenant's Memberships visible to a single
  # fleet-wide informer over that export's virtual workspace.
  #
  # `tenancy-provisioner` carries the accepted `create workspaces` claim that lets
  # child Workspaces be created in this Tenant. It is here — rather than
  # stamped by an initializer of our own — because kcp's default-apibinding
  # controller copies EVERY claim on the referenced APIExport into the binding it
  # creates, with state Accepted and (absent an explicit `defaultSelector` on the
  # export) selector matchAll. identityHash is copied along with the rest, so the
  # binding matches the export's claim exactly.
  #
  # A non-empty defaultAPIBindings also makes kcp add its OWN
  # `WorkspaceAPIBindingsInitializer`, which kcp clears once the bindings exist —
  # so the workspace still is not Ready until it is fully bound. That is the same
  # guarantee a custom initializer would give, without a controller to write or an
  # initializer only we can clear.
  #
  # DELIBERATELY NOT `tenancy-access`. That export carries the RBAC claims, and
  # binding it here would mean the platform can write ClusterRoleBindings into the
  # Tenant workspace — which is only useful for granting a TENANT access to
  # this tier, and no tenant may have it.
  #
  # The Tenant workspace holds the Memberships and Projects that decide who
  # can reach what. A tenant who could read and write here could grant themselves
  # anything, and would be doing it behind the virtual workspace rather than
  # through it, so every guard the VW applies (quota, sole-admin, the
  # tenant-membership-removal block) would be bypassed by construction rather than
  # merely unimplemented.
  #
  # The tier stays unreachable NOT because something refuses the request but
  # because no binding in this logical cluster names any tenant identity. That is
  # a stronger guarantee than a check: it survives a new client, a forgotten code
  # path, a direct front-proxy call and a misconfigured route, because it is not a
  # check at all. Tenant-scope Memberships therefore bind only in the Tenant's
  # PROJECT workspaces (see targetClusters), and Membership/Project writes arrive
  # through the tenancy virtual workspace, which holds the only credential here.
  defaultAPIBindings:
  - export: tenancy
    path: __EXPORTS_REF__
  - export: tenancy-provisioner
    path: __EXPORTS_REF__
---
apiVersion: tenancy.kcp.io/v1alpha1
kind: WorkspaceType
metadata:
  name: project
spec:
  # A Project may only be created under a Tenant or another Project. The shape is not
  # configurable, only where the tree is rooted.
  # __EXPORTS_PATH__, not __EXPORTS_REF__: kcp matches this against the parent
  # Workspace's own spec.type.path, which it always writes as a canonical path.
  # A logical cluster ID here is accepted at install time and only fails later,
  # when the first child Workspace is created.
  limitAllowedParents:
    types:
    - name: tenant
      path: __EXPORTS_PATH__
  # Leaves. Project nesting is LOGICAL, not structural: sub-projects are recorded
  # by spec.parent and their workspaces are still created as siblings under the
  # Tenant.
  #
  # Structural nesting would mean a Workspace object living inside a tenant's own
  # workspace, which requires binding tenancy-provisioner here — handing every
  # tenant space the `create workspaces` claim just so the platform can nest. A
  # tenant space gets exactly one binding, tenancy-access, and nothing that lets
  # anything create workspaces inside it.
  limitAllowedChildren:
    none: true
  #
  # TWO DELIBERATE OMISSIONS DO MOST OF THE WORK HERE:
  #
  # 1. No `extend: root:universal`. Universal would pull tenancy.kcp.io
  #    (Workspace/WorkspaceType) and topology.kcp.io into the TENANT's own API
  #    surface, letting a tenant spawn arbitrary child workspaces and inspect
  #    cluster topology. Both are platform surfaces, not tenant surfaces.
  #    The cost: kcp no longer auto-creates the `default` namespace, so the
  #    tenancy controller creates it explicitly.
  #
  # 2. Only ONE defaultAPIBindings entry, and it adds no tenant-facing API. A
  #    fresh Workspace exposes nothing beyond kcp built-ins; every API a tenant
  #    can use arrives by explicitly enabling a provider, which creates one
  #    APIBinding — so a workspace's API surface is exactly its enable list.
  #
  # The one binding it did not ask for is tenancy-access. That export declares no
  # resources at all, so `kubectl api-resources` shows the tenant nothing new;
  # what changes is that the platform's reach into this workspace becomes
  # declared, scoped and auditable.
  #
  # This is deliberately NOT a custom initializer. An initializer only we can
  # clear means that whenever this operator is absent, every new Workspace wedges
  # in Initializing with no way out but hand-patching a LogicalCluster. Binding
  # here instead lets kcp's own apibindings initializer do the holding — it clears
  # itself — and the work behind the claim (creating `default`, which kcp will not
  # create without `extend: root:universal`) is done by WorkspaceReconciler through
  # this export's virtual workspace. The cost is a brief window where the Workspace
  # is Ready before `default` appears; the gain is that a missing operator delays
  # provisioning instead of blocking it outright.
  defaultAPIBindings:
  - export: tenancy-access
    path: __EXPORTS_REF__
