# Who may BIND each tenancy export. Applied into the exports workspace.
#
# kcp gates APIBinding and APIExportEndpointSlice creation on a `bind` verb against
# the APIExport, evaluated in the EXPORT's workspace. It is a separate admission
# check, so a cluster-admin credential does not satisfy it — an export nobody may
# bind is an export nobody can use. (kcp does exactly this for its own
# `tenancy.kcp.io` export; see config/root/clusterrole-tenancy-apiexport-bind.yaml
# in the kcp repo.)
#
# Because `bind` is per-export, this file is also where the audience split stops
# being a naming convention and becomes enforced: the two exports a tenant tier
# must bind are open, the two that grant platform powers are not.

---
# TENANT-FACING. Every Tenant binds `tenancy` (via the tenant
# WorkspaceType's defaultAPIBindings) and every child workspace gets
# `tenancy-access` stamped by its initializer, so both must be bindable by an
# ordinary authenticated identity.
#
# Safe to open: binding `tenancy` lets a workspace store Memberships IN ITSELF,
# which grants nothing anywhere else — access is per-logical-cluster RBAC, and the
# Memberships the platform acts on are the ones in Tenant workspaces it
# created. `tenancy-access` declares no resources at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:platform-mesh:apiexport:tenancy:bind
rules:
- apiGroups: ["apis.kcp.io"]
  resources: ["apiexports"]
  resourceNames: ["tenancy", "tenancy-access"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:platform-mesh:authenticated:apiexport:tenancy:bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:platform-mesh:apiexport:tenancy:bind
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:authenticated
---
# PLATFORM-ONLY. These two are deliberately NOT open:
#
#   tenancy-platform      binding it is what makes a workspace able to STORE User,
#                         Tenant and UserMembershipIndex. Exactly one
#                         workspace may do that — the directory.
#   tenancy-provisioner   its claim is `create workspaces`. Binding it in a
#                         workspace is what makes that workspace a tier where
#                         Tenants (or team Workspaces) can be created.
#
# Restricted to the platform admin group, which is the installer and — once the
# Tenant initializer lands — the tenancy-operator's own identity, since it
# stamps the per-Tenant tenancy-provisioner binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:platform-mesh:apiexport:tenancy-platform:bind
rules:
- apiGroups: ["apis.kcp.io"]
  resources: ["apiexports"]
  resourceNames: ["tenancy-platform", "tenancy-provisioner"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:platform-mesh:admin:apiexport:tenancy-platform:bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:platform-mesh:apiexport:tenancy-platform:bind
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:kcp:admin
