# The two install-time APIBindings. Everything else is created by a controller or
# by a WorkspaceType initializer.
#
# An APIBinding does two unrelated things at once, and different tiers need
# different halves of it:
#
#   imports the export's SCHEMAS       provider -> consumer   the consumer can now
#                                                             STORE those objects
#   grants the export's CLAIMS         consumer -> provider   the provider's
#                                                             controllers can now
#                                                             REACH INTO the consumer
#
# The bindings below are applied to two different workspaces — apply each into the
# workspace named in its comment, not both into one.
#
# NOT directly appliable: __EXPORTS_REF__ is substituted at apply time. A
# binding references its export BY PATH, so hardcoding root:system:controllers here
# would make a sub-tree install (--paths-root=root:tenancy) a code change rather
# than a configuration one — and would silently bind the WRONG install's export
# when two of them share a kcp.

---
# In the DIRECTORY workspace (default root:system:directory), for the first
# reason: so User / Tenant / UserMembershipIndex are servable there.
#
# The directory is an ordinary consumer with a binding, not a special workspace.
# The platform's own global objects live there for exactly the same reason a
# tenant's Memberships live in their Tenant.
apiVersion: apis.kcp.io/v1alpha2
kind: APIBinding
metadata:
  name: tenancy-platform
spec:
  reference:
    export:
      path: __EXPORTS_REF__
      name: tenancy-platform
---
# In the TENANT FLEET ROOT (default root:tenants), for the second reason.
#
# Without this there is no way to create a Tenant at all: a Workspace
# object lives in its parent's logical cluster, so creating root:tenants:<tenant> is
# a write into root:tenants — a workspace that otherwise binds nothing. The export
# has no schemas, so this tier gains no API surface; it gains exactly one
# capability.
apiVersion: apis.kcp.io/v1alpha2
kind: APIBinding
metadata:
  name: tenancy-provisioner
spec:
  reference:
    export:
      path: __EXPORTS_REF__
      name: tenancy-provisioner
  permissionClaims:
  - group: tenancy.kcp.io
    resource: workspaces
    verbs: [get, list, watch, create, delete]
    # MUST match the identityHash on the export's claim, or the two claims are
    # different claims. kcp compares them by (group, resource, identityHash), so
    # an empty hash here leaves the claim exported-but-never-applied: the binding
    # still reports Bound, and the only symptom is the operator being told
    # `cannot create resource "workspaces" ... access denied` much later.
    identityHash: __TENANCY_KCP_IO_IDENTITY_HASH__
    state: Accepted
    # apis.kcp.io/v1alpha2 requires an ACCEPTED claim to say which objects it
    # covers — one of matchAll, matchLabels or matchExpressions. The consumer
    # chooses the scope, which is the point: accepting a claim is not "the
    # provider may do this", it is "the provider may do this TO THESE OBJECTS".
    #
    # matchAll here because the platform must see and create every Workspace in
    # this tier — that IS the capability. Narrowing it by label would mean a
    # workspace could opt out of being managed by the thing that creates it.
    selector:
      matchAll: true
