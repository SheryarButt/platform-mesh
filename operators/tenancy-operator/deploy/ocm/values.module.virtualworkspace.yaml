# Chart values that render the VIRTUAL WORKSPACE's OCM module payload — the
# second deployable unit of this component, applied by the deployer as a
# `per-front-proxy` component exposed through a `mapping`.
#
# Layered ON TOP of values.module.yaml by render.sh (helm merges -f files left
# to right), so everything the manager payload parameterizes — the kcp
# credential, ${workspace} as the paths root, the OIDC identity settings — is
# inherited, and this file says only what is different about the virtual
# workspace. render.sh restricts the output to templates/virtualworkspace.yaml;
# the manager objects the base values configure belong to the controller
# payload and must not be applied twice.

virtualWorkspace:
  enabled: true

  # The deployer mints the serving certificate for every mapped component —
  # signed by the root shard's server CA, which is the CA the front proxy
  # validates backends against — and syncs it into the component's namespace as
  # <module>-<component>-serving. The chart's own cert-manager Certificate must
  # stay off: its issuer (root-server-ca) does not exist in a deployer-built
  # cluster, and a second certificate for the same Service would fight the one
  # the front proxy actually trusts.
  cert:
    create: false
    secretName: ${module + "-" + component + "-serving"}

  # Exposure is owned by the OCMModule component's `mapping`, which adds the
  # path to the front proxy's path mappings. The chart's TLSRoute is the
  # chart-install way to expose this server; rendering it here too would give
  # the same backend two owners.
  gatewayApi:
    enabled: false

  # MUST be the same issuer kcp authenticates against — see the chart's
  # values.yaml. Read from the OCMModule's spec.values because the issuer is a
  # property of the installation, not of the packaged component.
  #
  # No caSecretName: whether the CA volume exists is decided at helm-render
  # time, i.e. at package time, so this payload assumes an issuer with a
  # publicly trusted certificate. An installation whose IdP serves from a
  # private CA (tilt's dex does) needs the chart installed directly until the
  # payload grows a CA variant.
  oidc:
    issuerURL: ${values.virtualWorkspace.oidc.issuerURL}
    clientID: ${values.virtualWorkspace.oidc.clientID}
    caSecretName: ""

# The controller payload creates the ServiceAccount, and this payload can land
# on a different cluster where it does not exist. The virtual workspace needs no
# access to the API of the cluster it runs in — its authority is the mounted
# kubeconfig — so it runs as `default` rather than dragging a copy of the
# ServiceAccount into a second payload.
serviceAccount:
  create: false
  name: ""
