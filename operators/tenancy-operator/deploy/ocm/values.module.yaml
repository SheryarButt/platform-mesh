# Chart values that render the OCM module payload rather than a Helm release.
#
# The output of `helm template` with this file is NOT applied by Helm: it is
# packaged as an OCM resource and applied by the platform-mesh-deployer, which
# interpolates the ${...} CEL expressions per component instance first. So every
# value below that the deployer owns — the namespace, the kcp credential, the
# workspace the tree is installed into — is written as an expression, not as a
# concrete string. See build.sh.

# The image is NOT set here. `tenancy-operator.image` composes registry,
# repository and tag into one string, and the payload needs that whole string to
# be a single CEL expression reading the component's own `image` resource. These
# three render the sentinel that build.sh rewrites; they are never resolved as an
# image reference.
image:
  registry: OCM
  repository: IMAGE
  tag: REF
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true

# Both containers mount the same credential: the kubeconfig the deployer mints
# for this module, which kcp grants cluster-admin INSIDE the module's own
# workspace subtree and nowhere else.
#
# That is what makes `init` safe here without a real kcp admin credential — and
# it is also why paths.root below must stay inside that subtree. Pointed at
# root:tenancy, the installer would be denied on the first workspace it creates.
init:
  mode: initContainer
  kcpAdminSecretName: ${kubeconfigSecrets.kcp}
  kcpAdminSecretKey: kubeconfig
  workspaceReadyTimeout: 2m

kcp:
  kubeconfigSecretName: ${kubeconfigSecrets.kcp}
  kubeconfigSecretKey: kubeconfig
  # Empty: the front-proxy kubeconfig the deployer mints already carries an
  # address that resolves and routes from inside the cluster (sslip.io), so there
  # is nothing to redirect.
  server: ""
  serverName: ""
  endpointSlices:
    platform: tenancy-platform
    tenancy: tenancy
    provisioner: tenancy-provisioner
    access: tenancy-access

# The module's own workspace, root:modules:<module>. Read from the template
# context rather than written down, so renaming the OCMModule cannot move the
# tree out from under the credential that is scoped to it.
paths:
  root: ${workspace}

# MUST mirror the kcp the module is installed into. Left as module values so one
# packaged component can serve installations with different authenticators — the
# OCMModule's spec.values decides, and a mismatch here is the silent-403 failure
# described in the chart's values.yaml.
oidc:
  usernameClaim: ${values.oidc.usernameClaim}
  usernamePrefix: ${values.oidc.usernamePrefix}

tenancy:
  personalTenantsEnabled: true
  tenantQuota: 10
  projectQuota: 50
  namingStrategy: uuid
  tenantWorkspaceType: tenant
  projectWorkspaceType: project

leaderElect: false

log:
  level: ${values.log.level}

# Off. The virtual workspace is a second deployable unit with its own placement
# and its own serving certificate; see README.md.
virtualWorkspace:
  enabled: false
