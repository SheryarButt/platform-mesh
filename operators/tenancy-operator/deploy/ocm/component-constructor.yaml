# The LOCAL build of the tenancy-operator component, for testing a module before
# a version is tagged.
#
# It mirrors what the release workflow publishes — same component name, same two
# resources that matter — minus the SBOMs and the signature. The released
# constructor is written inline by
# platform-mesh/.github/.github/workflows/job-image-ocm.yml; the
# `controller-manifests` resource below is the `extraResources` snippet that
# .github/workflows/tenancy-operator.yml passes it, and the two have to say the
# same thing.
#
# `controller-manifests` is what makes the component installable at all: an
# OCMModule's `resource` is downloaded with GetLocalResource, which resolves
# localBlob access only. A component carrying just the ociArtifact `image`
# passes spec validation and then fails at render time.
#
# Templated with `--templater subst`; see build.sh.
components:
  - name: github.com/platform-mesh/images/tenancy-operator
    version: ${VERSION}
    provider:
      name: Platform Mesh Team
    resources:
      # The payload the deployer applies for the `controller` component of the
      # OCMModule, rendered from deploy/helm/tenancy-operator by build.sh with
      # its CEL expressions left in place.
      - name: controller-manifests
        type: platformMesh.io/manifests
        version: ${VERSION}
        relation: local
        input:
          type: file
          path: ${MANIFESTS}
          mediaType: application/x-yaml

      # The payload for the `virtual-workspace` component: the same chart's
      # virtualworkspace.yaml template only, rendered with the VW module values
      # layered on top. Deployed per-front-proxy and exposed through the
      # OCMModule component's `mapping`; the serving certificate is minted by
      # the deployer, not by the payload.
      - name: virtualworkspace-manifests
        type: platformMesh.io/manifests
        version: ${VERSION}
        relation: local
        input:
          type: file
          path: ${MANIFESTS_VW}
          mediaType: application/x-yaml

      # The image the payload runs, read back by the manifests through the
      # descriptor's resources list with byName("image").
      #
      # `relation: external` because it is built and signed elsewhere — by the
      # release workflow that publishes the images component.
      - name: image
        type: ociImage
        version: ${IMAGE_VERSION}
        relation: external
        access:
          type: ociArtifact
          imageReference: ${IMAGE}
