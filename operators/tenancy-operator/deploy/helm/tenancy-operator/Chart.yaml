# Deliberately NO `common` subchart dependency, unlike the charts in the
# helm-charts repo. This one lives beside the code it deploys so a reader can see
# the whole deployment in one directory, and so `tilt up` renders it without a
# network fetch. If it ever moves to helm-charts, adopting `common` is the first
# thing to do — most of templates/ collapses into its helpers.
