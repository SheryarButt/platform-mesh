apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenancy-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tenancy-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenancy-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tenancy-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      # See values.yaml: the operator dials the absolute URLs kcp publishes in its
      # APIExportEndpointSlices, which no kubeconfig rewrite can redirect.
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.init.mode "initContainer" }}
      # Installs the tenancy tree into kcp, then exits.
      #
      # Creating the system workspaces, the APIExports and their schemas, the
      # WorkspaceTypes and the two install-time APIBindings is the one part of the
      # model that legitimately needs kcp admin. Running it HERE means the
      # credential leaves with the container: the manager below never holds it, and
      # reaches the fleet only through APIExport virtual workspaces bounded by
      # permission claims.
      #
      # Idempotent, so it runs on every pod start and on every upgrade.
      initContainers:
        {{- include "tenancy-operator.initContainer" . | nindent 6 }}
      {{- end }}
      containers:
      - name: manager
        image: {{ include "tenancy-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # args only (no command) so the image ENTRYPOINT is used — /operator/manager
        # in the production image, /entrypoint in the Tilt hot-reload image.
        args:
          {{- include "tenancy-operator.args" . | nindent 10 }}
        env:
        - name: KUBECONFIG
          value: /etc/kcp/kubeconfig
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
        - name: health
          containerPort: {{ .Values.health.port }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: kcp-kubeconfig
          mountPath: /etc/kcp
          readOnly: true
      volumes:
      - name: kcp-kubeconfig
        secret:
          # May point at any workspace: the operator computes its own exports-
          # workspace URL from --paths-*, so one credential serves both containers
          # and neither can be aimed at a workspace the other did not use.
          secretName: {{ .Values.kcp.kubeconfigSecretName }}
          items:
          - key: {{ .Values.kcp.kubeconfigSecretKey }}
            path: kubeconfig
          defaultMode: 420
      {{- if eq .Values.init.mode "initContainer" }}
        {{- include "tenancy-operator.initVolume" . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
