{{/*
The installer as a standalone Job (init.mode=job).

Same binary, same args and same credential as the initContainer mode — the only
difference is WHERE it runs, and therefore what can observe it:

  initContainer  the default, and the right shape in production. Ordering is a
                 property of the pod: the manager cannot start before the tree
                 exists, and there is nothing extra to schedule or clean up.

  job            one object with its own name, logs and completion status. That
                 makes it a first-class resource in a dev UI — visible, waitable
                 and re-runnable on its own — and lets the manager's readiness be
                 debugged separately from the install.

Both are idempotent, so switching modes is safe and running both would be
harmless (though `none` exists for when the tree is installed out of band).

Job.spec is immutable, so by default the name carries a hash of the installer
spec: changing the image or the flags produces a NEW Job rather than a failed
update, and completed Jobs remove themselves via ttlSecondsAfterFinished.

Set init.jobNameSuffix to pin the name instead. A dev loop rebuilds the image
constantly, and a name that changes every build means a new resource in the UI
every build — there the stable name is worth more than the automatic recreate,
because the tool doing the deploying can recreate the Job itself.
*/}}
{{- if eq .Values.init.mode "job" }}
{{- $spec := printf "%s%s" (include "tenancy-operator.initContainer" .) (include "tenancy-operator.initVolume" .) }}
{{- $suffix := default (printf "%s" ($spec | sha256sum | trunc 8)) .Values.init.jobNameSuffix }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tenancy-operator.fullname" . }}-init-{{ $suffix }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
spec:
  backoffLimit: {{ .Values.init.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.init.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "tenancy-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "tenancy-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "tenancy-operator.initContainer" . | nindent 6 }}
      volumes:
        {{- include "tenancy-operator.initVolume" . | nindent 6 }}
{{- end }}
