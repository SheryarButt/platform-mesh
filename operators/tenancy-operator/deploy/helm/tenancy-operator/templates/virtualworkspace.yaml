{{/*
The tenancy virtual workspace.

Its own Deployment rather than a second container in the manager's pod: the two
have opposite scaling shapes. This is stateless and scales horizontally with a
watch per caller; the manager is a leader-elected singleton. Sharing a pod would
force the manager's replica count onto this.

Same image, different command — which is the whole reason the VW lives in this
operator: it shares pkg/paths, pkg/identity and the API types with the code that
reconciles what it writes.
*/}}
{{- if .Values.virtualWorkspace.enabled }}
{{- if .Values.virtualWorkspace.cert.create }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "tenancy-operator.vwFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
spec:
  # The front-proxy routes to this Service, so the certificate has to carry the
  # in-cluster names it will be reached by.
  dnsNames:
  - {{ include "tenancy-operator.vwFullname" . }}
  - {{ include "tenancy-operator.vwFullname" . }}.{{ .Release.Namespace }}
  - {{ include "tenancy-operator.vwFullname" . }}.{{ .Release.Namespace }}.svc
  - {{ include "tenancy-operator.vwFullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  {{- with .Values.virtualWorkspace.cert.extraDnsNames }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .Values.virtualWorkspace.gatewayApi.hostname }}
  # The out-of-cluster name, when the front proxy has to reach this server
  # through the gateway rather than by Service DNS. The gateway is TLS
  # PASSTHROUGH, so this server still terminates TLS itself and the front proxy
  # verifies THIS certificate — which therefore has to carry the name it dialled.
  - {{ . }}
  {{- end }}
  duration: {{ .Values.virtualWorkspace.cert.duration }}
  renewBefore: {{ .Values.virtualWorkspace.cert.renewBefore }}
  issuerRef:
    group: cert-manager.io
    kind: {{ .Values.virtualWorkspace.cert.issuer.kind }}
    name: {{ .Values.virtualWorkspace.cert.issuer.name }}
  privateKey:
    algorithm: {{ .Values.virtualWorkspace.cert.key.algorithm }}
    size: {{ .Values.virtualWorkspace.cert.key.size }}
  secretName: {{ .Values.virtualWorkspace.cert.secretName }}
  usages:
  - server auth
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenancy-operator.vwFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tenancy-operator.vwSelectorLabels" . | nindent 4 }}
  ports:
  - name: https
    port: {{ .Values.virtualWorkspace.service.port }}
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenancy-operator.vwFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: virtual-workspace
spec:
  replicas: {{ .Values.virtualWorkspace.replicaCount }}
  selector:
    matchLabels:
      {{- include "tenancy-operator.vwSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenancy-operator.vwSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tenancy-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      # Needed for the same reason the manager needs them: kcp's published
      # hostnames resolve to 127.0.0.1 inside a pod.
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: virtual-workspace
        image: {{ include "tenancy-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # args only (no command) so the image ENTRYPOINT is used — /operator/manager
        # in the production image, /entrypoint in the Tilt hot-reload image.
        args:
          {{- include "tenancy-operator.vwArgs" . | nindent 10 }}
        env:
        - name: KUBECONFIG
          value: /etc/kcp/kubeconfig
        ports:
        - name: https
          containerPort: {{ .Values.virtualWorkspace.service.port }}
        # TCP, not an HTTP probe on /readyz.
        #
        # This server authenticates every request against the OIDC issuer, and a
        # kubelet probe is anonymous — so an HTTP probe gets 401 and the pod is
        # killed by its own liveness check while serving perfectly well. The usual
        # fix is to enable anonymous auth so the health endpoints answer, but that
        # widens the authentication surface of the one component that guards the
        # tenant tier, to satisfy a probe. Not worth it: a TCP check answers the
        # question that matters here — is it accepting connections on the serving
        # port — without granting anyone an unauthenticated way in.
        readinessProbe:
          tcpSocket:
            port: https
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: https
          initialDelaySeconds: 15
          periodSeconds: 20
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: kcp-kubeconfig
          mountPath: /etc/kcp
          readOnly: true
        - name: vw-tls
          mountPath: /etc/vw-tls
          readOnly: true
        {{- if .Values.virtualWorkspace.oidc.caSecretName }}
        - name: oidc-ca
          mountPath: /etc/oidc
          readOnly: true
        {{- end }}
      volumes:
      - name: kcp-kubeconfig
        secret:
          secretName: {{ .Values.kcp.kubeconfigSecretName }}
          items:
          - key: {{ .Values.kcp.kubeconfigSecretKey }}
            path: kubeconfig
          defaultMode: 420
      - name: vw-tls
        secret:
          secretName: {{ .Values.virtualWorkspace.cert.secretName }}
          defaultMode: 420
      {{- if .Values.virtualWorkspace.oidc.caSecretName }}
      - name: oidc-ca
        secret:
          secretName: {{ .Values.virtualWorkspace.oidc.caSecretName }}
          defaultMode: 420
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.virtualWorkspace.gatewayApi.enabled .Values.virtualWorkspace.gatewayApi.hostname }}
---
# Reaches this virtual workspace from OUTSIDE its cluster, by SNI.
#
# Not a second entrypoint for end users. Callers always arrive at the kcp front
# proxy, on the path mapped to this server (/services/tenancy/); this route is
# how that front proxy reaches the backend when the backend is not in its own
# cluster. Same-cluster installs need none of this — the mapping names the
# Service directly and `enabled: false` is correct.
#
# So the client of this route is the front proxy, which is why the certificate
# above must carry the hostname below: the proxy verifies the backend it dials.
#
# TLSRoute rather than HTTPRoute because the listener is passthrough: the gateway
# must not terminate TLS here. The front proxy is doing the verification, and a
# gateway that terminated would break the chain it checks — and would insert a
# component holding every tenant's token that no one decided to trust.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "tenancy-operator.vwFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.virtualWorkspace.gatewayApi.name }}
      namespace: {{ .Values.virtualWorkspace.gatewayApi.namespace | default .Release.Namespace }}
      sectionName: {{ .Values.virtualWorkspace.gatewayApi.sectionName }}
  hostnames:
    - {{ .Values.virtualWorkspace.gatewayApi.hostname }}
  rules:
    - backendRefs:
        - name: {{ include "tenancy-operator.vwFullname" . }}
          port: {{ .Values.virtualWorkspace.service.port }}
{{- end }}
