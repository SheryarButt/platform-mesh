{{/*
No ClusterRole ships with this chart, and that is not an omission.

The operator talks to kcp, never to the API of the cluster it runs in. Its
authority is the mounted kubeconfig plus the permission claims on the APIExports
it reads through — both of which live in kcp. Granting it anything here would be
reach it has no use for.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenancy-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenancy-operator.labels" . | nindent 4 }}
{{- end }}
