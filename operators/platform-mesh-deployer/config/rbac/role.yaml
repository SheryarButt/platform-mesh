# The deployer reads its own API, drives kcp-operator, mints certificates and
# moves the resulting secrets and config to the clusters it manages.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  - apiGroups:
      - deploy.platform-mesh.io
    resources:
      - platformmeshes
      - ocmmodules
      - ocmmodulesetups
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - deploy.platform-mesh.io
    resources:
      - platformmeshes/status
      - ocmmodules/status
      - ocmmodulesetups/status
    verbs: ["get", "update", "patch"]
  - apiGroups:
      - deploy.platform-mesh.io
    resources:
      - platformmeshes/finalizers
      - ocmmodules/finalizers
      - ocmmodulesetups/finalizers
    verbs: ["update"]

  # Templates are read by the topology and held by a finalizer while in use.
  - apiGroups:
      - deploy.platform-mesh.io
    resources:
      - rootshardtemplates
      - shardtemplates
      - frontproxytemplates
      - cacheservertemplates
      - virtualworkspacetemplates
    verbs: ["get", "list", "watch", "update", "patch"]

  # Admin CRs and the kubeconfigs minted from them.
  - apiGroups:
      - operator.kcp.io
    resources:
      - rootshards
      - shards
      - frontproxies
      - cacheservers
      - virtualworkspaces
      - kubeconfigs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Status and finalizers on the admin CRs, for kcp-operator's config group.
  # controller-gen cannot see its markers from another module, so these are
  # transcribed from its own config/rbac/role.yaml by hand.
  - apiGroups:
      - operator.kcp.io
    resources:
      - rootshards/status
      - shards/status
      - frontproxies/status
      - cacheservers/status
      - virtualworkspaces/status
      - kubeconfigs/status
    verbs: ["get", "update", "patch"]
  - apiGroups:
      - operator.kcp.io
    resources:
      - rootshards/finalizers
      - shards/finalizers
      - frontproxies/finalizers
      - cacheservers/finalizers
      - kubeconfigs/finalizers
    verbs: ["update"]
  # Compiled CRs are read on the config plane and written on workload clusters.
  - apiGroups:
      - deploy.operator.kcp.io
    resources:
      - compiledrootshards
      - compiledshards
      - compiledfrontproxies
      - compiledcacheservers
      - compiledvirtualworkspaces
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - deploy.operator.kcp.io
    resources:
      - compiledrootshards/status
      - compiledshards/status
      - compiledfrontproxies/status
      - compiledcacheservers/status
      - compiledvirtualworkspaces/status
    verbs: ["get", "update", "patch"]
  - apiGroups:
      - deploy.operator.kcp.io
    resources:
      - compiledrootshards/finalizers
      - compiledshards/finalizers
      - compiledfrontproxies/finalizers
      - compiledcacheservers/finalizers
      - compiledvirtualworkspaces/finalizers
    verbs: ["update"]

  # Serving certificates for module components fronted by the front proxy, and
  # the CAs kcp-operator's config group issues the kcp certificates from.
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Ingress for exposed kcp endpoints.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - tlsroutes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kubeconfig secrets in, generated ConfigMaps and copied secrets out.
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]

  # The kcp-operator workload group writes Deployments and Services, but on the
  # engaged clusters, through their kubeconfig Secrets — not with this identity.
  # Whatever mints those credentials has to grant it there.

