apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The TLS etcd, pinned into the provider namespace.
#
# config/bases/etcd-tls carries no namespace of its own: the e2e suite applies it
# with `kubectl apply -k -n platform-mesh-system`, and a namespace baked into the
# base would silently override that. Tilt's kustomize() builtin has no equivalent
# of `-n`, so this overlay supplies it — the same namespace the deployer watches
# for kubeconfig secrets (--provider-namespace) and creates its admin CRs in.
#
# Deliberately does NOT include ../bases/cert-issuer or ../bases/envoy-gateway:
# the ClusterIssuer and GatewayClass are cluster-scoped, and the `eg` Gateway
# already names envoy-gateway-system explicitly — a `namespace:` transformer here
# would rewrite it to platform-mesh-system and orphan the gateway from its
# controller. Those two are applied unmodified instead.
namespace: platform-mesh-system

resources:
  - ../bases/etcd-tls
