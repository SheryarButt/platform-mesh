---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ocmmodules.deploy.platform-mesh.io
spec:
  group: deploy.platform-mesh.io
  names:
    kind: OCMModule
    listKind: OCMModuleList
    plural: ocmmodules
    singular: ocmmodule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.component
      name: Component
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.stage
      name: Stage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OCMModule is the schema for a module deployed on top of a PlatformMesh
          installation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OCMModuleSpec defines the desired state of a OCMModule deployed
              on top of a PlatformMesh installation.
            properties:
              component:
                description: Component is the name of the module's OCM component,
                  e.g. github.com/platform-mesh/platform-mesh/security-operator.
                minLength: 1
                type: string
              components:
                description: Components are the deployable units of the module.
                items:
                  description: OCMModuleComponent is one deployable unit of a module.
                  properties:
                    kubeconfigs:
                      description: Kubeconfigs references entries of OCMModuleSpec.Kubeconfigs
                        that are minted for this component and synced to its clusters.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    mapping:
                      description: |-
                        Mapping exposes the component under a URI path of the front proxy.
                        Only supported when Placement is per-front-proxy.
                      properties:
                        host:
                          description: |-
                            Host is the DNS name of the backend, for a backend the front proxy cannot
                            reach by Service DNS — a component placed on a different cluster, reached
                            over an ingress or gateway.

                            The front proxy verifies the certificate the backend presents, so the
                            backend's serving certificate must carry this name. The deployer adds it to
                            the certificate it issues for this component; a backend serving a
                            certificate of its own has to include it.

                            Terminating the connection between the front proxy and the backend breaks
                            that verification, so whatever routes this name must pass TLS through.
                            Supports ${ ... } templating.
                          minLength: 1
                          type: string
                        path:
                          description: |-
                            Path is the URI path added to the front proxy's path mappings, e.g.
                            /services/acme/.
                          pattern: ^/.*$
                          type: string
                        port:
                          description: Port is the port the backend serves TLS on.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        service:
                          description: |-
                            Service is the name of the backend Service, for a backend in the SAME
                            cluster as the front proxy. Resolved as <service>.<component namespace>.svc.
                            Supports ${ ... } templating.
                          minLength: 1
                          type: string
                      required:
                      - path
                      - port
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of service (a backend in the front
                          proxy's own cluster) or host (a backend reached over the
                          network)
                        rule: has(self.service) != has(self.host)
                    name:
                      description: Name identifies the component within the module.
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace is the namespace the component's objects
                        are created in.
                      minLength: 1
                      type: string
                    placement:
                      description: Placement selects the clusters the component is
                        deployed to.
                      enum:
                      - root-shard
                      - per-shard
                      - per-front-proxy
                      - all-clusters
                      type: string
                    resource:
                      description: |-
                        Resource is the name of the component version resource holding the
                        component's manifests.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  - placement
                  - resource
                  type: object
                  x-kubernetes-validations:
                  - message: mapping is only supported for per-front-proxy components
                    rule: '!has(self.mapping) || self.placement == ''per-front-proxy'''
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              dependsOn:
                description: DependsOn references OCMModules of the same PlatformMesh
                  that must be ready before this one is deployed.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              kubeconfigs:
                description: Kubeconfigs are the kcp kubeconfigs minted for this module
                  and referenced by its components.
                items:
                  description: OCMModuleKubeconfig allows a module to request a kubeconfig
                    for a specific target.
                  properties:
                    name:
                      description: |-
                        Name identifies the kubeconfig.
                        Components reference it by this name and the minted secret is named <module>-<name>.
                      minLength: 1
                      type: string
                    target:
                      description: Target selects the kcp component the kubeconfig
                        points at.
                      enum:
                      - front-proxy
                      - shard
                      - root-shard
                      type: string
                    workspace:
                      description: |-
                        Workspace names the module workspace the kubeconfig is scoped to.
                        Empty targets the module workspace itself.
                      type: string
                  required:
                  - name
                  - target
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              ocm:
                description: The OCM repository the module component is resolved from.
                properties:
                  component:
                    description: Component is the name of the OCM component to resolve.
                    type: string
                  secretRef:
                    description: SecretRef references a secret containing credentials
                      for the repository.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    description: URL is the OCM repository (registry) URL.
                    minLength: 1
                    type: string
                required:
                - url
                type: object
              platformMeshRef:
                description: PlatformMeshRef references the PlatformMesh installation
                  the module is deployed to.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              stage:
                description: Stage orders the module relative to the kcp deployment.
                enum:
                - pre-topology
                - post-topology
                type: string
              values:
                description: Values holds module-specific configuration, exposed to
                  the payload templating as ${values.*}.
                x-kubernetes-preserve-unknown-fields: true
              version:
                description: Version is the pinned version of the module component.
                minLength: 1
                type: string
              workspaces:
                description: Workspaces are the kcp workspaces the module needs provisioned.
                items:
                  description: OCMModuleWorkspace is a kcp workspace that will be
                    created for the module.
                  properties:
                    content:
                      description: |-
                        Content references the component version resources holding the
                        manifests that should be applied in this workspace.
                      items:
                        description: ResourceRef references a resource of an OCM component
                          version.
                        properties:
                          digest:
                            description: Digest is the digest of the resource.
                            type: string
                          name:
                            description: Name is the name of the resource within the
                              component version.
                            minLength: 1
                            type: string
                          version:
                            description: Version is the version of the resource.
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    name:
                      default: ""
                      description: |-
                        Name is the workspace name relative to the module workspace.
                        Empty targets the module workspace itself. Children must not be nested.
                        The empty default is required because the field is the list map key.
                      pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$
                      type: string
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - component
            - platformMeshRef
            - stage
            - version
            type: object
            x-kubernetes-validations:
            - message: pre-topology modules cannot declare workspaces
              rule: self.stage != 'pre-topology' || !has(self.workspaces)
            - message: pre-topology modules cannot declare kubeconfigs
              rule: self.stage != 'pre-topology' || !has(self.kubeconfigs)
          status:
            description: OCMModuleStatus defines the observed state of a OCMModule.
            properties:
              appliedKinds:
                description: |-
                  AppliedKinds are the kinds the module's payloads produced. Teardown
                  needs them because a deleted module can no longer resolve its
                  component version to find out what it once applied.
                items:
                  description: GroupVersionKind identifies a kind the deployer applied.
                  properties:
                    group:
                      type: string
                    kind:
                      minLength: 1
                      type: string
                    version:
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - version
                  type: object
                type: array
              components:
                description: Components are the deployed components and their instances.
                items:
                  description: OCMModuleComponentStatus records the fan-out of one
                    component.
                  properties:
                    instances:
                      description: Instances are the per-cluster deployments of the
                        component.
                      items:
                        description: OCMModuleInstanceStatus records one component
                          deployed to one cluster.
                        properties:
                          cluster:
                            description: Cluster is the ID of the cluster the instance
                              runs on.
                            type: string
                          configMap:
                            description: ConfigMap is the name of the generated ConfigMap
                              holding the instance's runtime facts.
                            type: string
                          mapping:
                            description: |-
                              Mapping is the front proxy path mapping this instance is served
                              under, once its backend and certificate are resolved.
                            properties:
                              backend:
                                description: Backend is the URL of the component's
                                  Service.
                                type: string
                              path:
                                description: Path is the URI path the front proxy
                                  routes to the component.
                                type: string
                            required:
                            - backend
                            - path
                            type: object
                          namespace:
                            description: Namespace is the namespace the instance's
                              objects were created in.
                            type: string
                          ready:
                            description: Ready reports whether the instance's objects
                              have been applied.
                            type: boolean
                          secrets:
                            description: Secrets lists the kubeconfig secrets synced
                              to this cluster.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                        required:
                        - cluster
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - cluster
                      x-kubernetes-list-type: map
                    name:
                      description: Name is the component name.
                      type: string
                    placement:
                      description: Placement is the resolved placement of the component.
                      enum:
                      - root-shard
                      - per-shard
                      - per-front-proxy
                      - all-clusters
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nextReconcileTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              resolvedDigest:
                description: ResolvedDigest is the digest of the resolved component
                  version.
                type: string
              workspaces:
                description: Workspaces are the module's provisioned kcp workspaces.
                items:
                  description: OCMModuleWorkspaceStatus records a provisioned workspace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name is the workspace name relative to the module workspace.
                        The empty default is required because the field is the list map key.
                      type: string
                    path:
                      description: Path is the resolved absolute workspace path.
                      type: string
                    ready:
                      description: Ready reports whether the workspace has been provisioned.
                      type: boolean
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
