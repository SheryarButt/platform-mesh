---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: platformmeshes.deploy.platform-mesh.io
spec:
  group: deploy.platform-mesh.io
  names:
    kind: PlatformMesh
    listKind: PlatformMeshList
    plural: platformmeshes
    singular: platformmesh
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.resolvedVersion
      name: Resolved
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformMesh is the schema for a Platform Mesh installation managed by the
          deployer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlatformMeshSpec defines the desired state of a PlatformMesh
              installation.
            properties:
              ingress:
                description: |-
                  Ingress defines the ingress stacks endpoints are exposed through. All
                  types can coexist.
                items:
                  description: |-
                    IngressStack describes one ingress technology deployment endpoints are exposed through.
                    Multiple stacks of different types can coexist.
                  properties:
                    gatewayAPI:
                      description: GatewayAPI configures the stack when Type is gatewayapi.
                      properties:
                        gatewayName:
                          description: GatewayName is the name of the shared Gateway
                            the TLSRoutes attach to.
                          minLength: 1
                          type: string
                        gatewayNamespace:
                          description: GatewayNamespace is the namespace of the Gateway.
                            Optional; defaults to the route's namespace.
                          type: string
                        sectionName:
                          description: SectionName optionally pins a specific Gateway
                            listener.
                          type: string
                      required:
                      - gatewayName
                      type: object
                    name:
                      description: Name identifies the ingress stack. Referenced by
                        Exposure.IngressRefs.
                      minLength: 1
                      type: string
                    type:
                      description: Type is the ingress technology of this stack.
                      enum:
                      - gatewayapi
                      - istio
                      - traefik
                      type: string
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: gatewayAPI must be set when type is gatewayapi
                    rule: self.type != 'gatewayapi' || has(self.gatewayAPI)
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              ocm:
                description: |-
                  OCM describes the OCM repository and aggregate component to deploy
                  from.
                properties:
                  component:
                    description: Component is the name of the OCM component to resolve.
                    type: string
                  secretRef:
                    description: SecretRef references a secret containing credentials
                      for the repository.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    description: URL is the OCM repository (registry) URL.
                    minLength: 1
                    type: string
                required:
                - url
                type: object
              topology:
                description: Topology describes the kcp topology.
                properties:
                  cacheServer:
                    description: |-
                      CacheServer is the kcp cache server.
                      If unset, the root shard's embedded cache is used.
                    properties:
                      name:
                        description: Name identifies the cache server, e.g. "global",
                          "eu", "us".
                        minLength: 1
                        type: string
                      seedRef:
                        description: |-
                          SeedRef references another cache server to seed from, enabling a
                          future federation upgrade path. Must be empty in v1alpha1.
                        type: string
                      templateRef:
                        description: |-
                          TemplateRef references a CacheServerTemplate merged onto the rendered
                          CacheServer resource.
                          Deployer-owned fields (certificates) win over template values.
                        properties:
                          name:
                            description: Name of the template.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the template. Defaults to the
                              PlatformMesh's namespace.
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: seedRef is not supported in v1alpha1 (see kcp-dev/kcp#4055)
                      rule: '!has(self.seedRef) || self.seedRef.size() == 0'
                  frontProxy:
                    description: FrontProxy is the kcp front proxy.
                    properties:
                      exposure:
                        description: Exposure describes how the front proxy is exposed.
                        properties:
                          hostnameTemplate:
                            description: |-
                              HostnameTemplate is the hostname the endpoint is exposed under.
                              It supports the template variables {{ .Name }} and {{ .Cluster }}.
                            minLength: 1
                            type: string
                          ingressRefs:
                            description: |-
                              IngressRefs references ingress stacks by name.
                              If empty, the endpoint is exposed through all defined ingress stacks.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          port:
                            description: Port is the port the endpoint is exposed
                              on.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        required:
                        - hostnameTemplate
                        - port
                        type: object
                      name:
                        description: Name identifies the front proxy.
                        minLength: 1
                        type: string
                      templateRef:
                        description: |-
                          TemplateRef references a FrontProxyTemplate merged onto the rendered
                          FrontProxy resource.
                          Deployer-owned fields (rootShard ref, external/exposure) win over
                          template values.
                        properties:
                          name:
                            description: Name of the template.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the template. Defaults to the
                              PlatformMesh's namespace.
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - name
                    type: object
                  rootShard:
                    description: RootShard is the kcp root shard.
                    properties:
                      cacheServerRef:
                        description: CacheServerRef references a cache server by name.
                        type: string
                      exposure:
                        description: Exposure describes how the root shard endpoint
                          is exposed.
                        properties:
                          hostnameTemplate:
                            description: |-
                              HostnameTemplate is the hostname the endpoint is exposed under.
                              It supports the template variables {{ .Name }} and {{ .Cluster }}.
                            minLength: 1
                            type: string
                          ingressRefs:
                            description: |-
                              IngressRefs references ingress stacks by name.
                              If empty, the endpoint is exposed through all defined ingress stacks.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          port:
                            description: Port is the port the endpoint is exposed
                              on.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        required:
                        - hostnameTemplate
                        - port
                        type: object
                      name:
                        description: Name identifies the root shard group.
                        minLength: 1
                        type: string
                      templateRef:
                        description: |-
                          TemplateRef references a RootShardTemplate merged onto the rendered
                          RootShard resources.
                        properties:
                          name:
                            description: Name of the template.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the template. Defaults to the
                              PlatformMesh's namespace.
                            type: string
                        required:
                        - name
                        type: object
                      virtualWorkspaces:
                        description: VirtualWorkspaces configures the virtual workspaces
                          server for the root shard.
                        properties:
                          exposure:
                            description: Exposure describes how the virtual workspaces
                              endpoint is exposed.
                            properties:
                              hostnameTemplate:
                                description: |-
                                  HostnameTemplate is the hostname the endpoint is exposed under.
                                  It supports the template variables {{ .Name }} and {{ .Cluster }}.
                                minLength: 1
                                type: string
                              ingressRefs:
                                description: |-
                                  IngressRefs references ingress stacks by name.
                                  If empty, the endpoint is exposed through all defined ingress stacks.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              port:
                                description: Port is the port the endpoint is exposed
                                  on.
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                            required:
                            - hostnameTemplate
                            - port
                            type: object
                          mode:
                            default: Embedded
                            description: |-
                              Mode selects whether virtual workspaces are served embedded in the
                              shard or by a standalone deployment.
                            enum:
                            - Embedded
                            - Standalone
                            type: string
                          templateRef:
                            description: |-
                              TemplateRef references a VirtualWorkspaceTemplate merged onto the
                              rendered VirtualWorkspace resource.
                              Deployer-owned fields (target, external) win over template values.
                            properties:
                              name:
                                description: Name of the template.
                                minLength: 1
                                type: string
                              namespace:
                                description: Namespace of the template. Defaults to
                                  the PlatformMesh's namespace.
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                    required:
                    - name
                    - virtualWorkspaces
                    type: object
                  shardGroups:
                    description: ShardGroups are additional kcp shard groups.
                    items:
                      description: |-
                        ShardGroup describes a group of kcp shards. One shard is deployed per
                        matched cluster.
                      properties:
                        cacheServerRef:
                          description: |-
                            CacheServerRef references a cache server by name.
                            Defaults to the sole defined cache server.
                          type: string
                        exposure:
                          description: Exposure describes how the shard endpoint is
                            exposed.
                          properties:
                            hostnameTemplate:
                              description: |-
                                HostnameTemplate is the hostname the endpoint is exposed under.
                                It supports the template variables {{ .Name }} and {{ .Cluster }}.
                              minLength: 1
                              type: string
                            ingressRefs:
                              description: |-
                                IngressRefs references ingress stacks by name.
                                If empty, the endpoint is exposed through all defined ingress stacks.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: set
                            port:
                              description: Port is the port the endpoint is exposed
                                on.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                          required:
                          - hostnameTemplate
                          - port
                          type: object
                        name:
                          description: Name identifies the shard group.
                          minLength: 1
                          type: string
                        templateRef:
                          description: |-
                            TemplateRef references a ShardTemplate merged onto the rendered Shard
                            resources.
                          properties:
                            name:
                              description: Name of the template.
                              minLength: 1
                              type: string
                            namespace:
                              description: Namespace of the template. Defaults to
                                the PlatformMesh's namespace.
                              type: string
                          required:
                          - name
                          type: object
                        virtualWorkspaces:
                          description: |-
                            VirtualWorkspaces configures the virtual workspaces server for this
                            shard group.
                          properties:
                            exposure:
                              description: Exposure describes how the virtual workspaces
                                endpoint is exposed.
                              properties:
                                hostnameTemplate:
                                  description: |-
                                    HostnameTemplate is the hostname the endpoint is exposed under.
                                    It supports the template variables {{ .Name }} and {{ .Cluster }}.
                                  minLength: 1
                                  type: string
                                ingressRefs:
                                  description: |-
                                    IngressRefs references ingress stacks by name.
                                    If empty, the endpoint is exposed through all defined ingress stacks.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: set
                                port:
                                  description: Port is the port the endpoint is exposed
                                    on.
                                  format: int32
                                  maximum: 65535
                                  minimum: 1
                                  type: integer
                              required:
                              - hostnameTemplate
                              - port
                              type: object
                            mode:
                              default: Embedded
                              description: |-
                                Mode selects whether virtual workspaces are served embedded in the
                                shard or by a standalone deployment.
                              enum:
                              - Embedded
                              - Standalone
                              type: string
                            templateRef:
                              description: |-
                                TemplateRef references a VirtualWorkspaceTemplate merged onto the
                                rendered VirtualWorkspace resource.
                                Deployer-owned fields (target, external) win over template values.
                              properties:
                                name:
                                  description: Name of the template.
                                  minLength: 1
                                  type: string
                                namespace:
                                  description: Namespace of the template. Defaults
                                    to the PlatformMesh's namespace.
                                  type: string
                              required:
                              - name
                              type: object
                          type: object
                      required:
                      - name
                      - virtualWorkspaces
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - frontProxy
                - rootShard
                type: object
              version:
                description: Version is the pinned version of the aggregate OCM component
                  version.
                minLength: 1
                type: string
            required:
            - ocm
            - topology
            - version
            type: object
          status:
            description: |-
              PlatformMeshStatus defines the observed state of a PlatformMesh
              installation.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nextReconcileTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              resolvedDigest:
                description: ResolvedDigest is the digest of the resolved component
                  version.
                type: string
              resolvedVersion:
                description: |-
                  ResolvedVersion is the resolved component version of the aggregate
                  component.
                type: string
              rootShardCluster:
                description: |-
                  RootShardCluster is the cluster the root shard is deployed to.
                  This field is only used to ensure that the root cluster provider does not yield more than one cluster.
                type: string
              shardAssignments:
                description: ShardAssignments is the shard to cluster assignment table.
                items:
                  description: ShardAssignment records the cluster a shard has been
                    assigned to.
                  properties:
                    cluster:
                      description: Cluster is the name of the cluster the shard is
                        assigned to.
                      type: string
                    shard:
                      description: Shard is the name of the shard.
                      type: string
                    shardGroup:
                      description: ShardGroup is the name of the shard group.
                      type: string
                  required:
                  - cluster
                  - shard
                  - shardGroup
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
