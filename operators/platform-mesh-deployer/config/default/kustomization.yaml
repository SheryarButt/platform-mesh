apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the deployer itself needs on the config plane. cert-manager and
# the config-mode kcp-operator are separate prerequisites; see config/bases.
namespace: platform-mesh-system
namePrefix: platform-mesh-deployer-

resources:
  - ../crd
  - ../rbac
  - ../manager

# The published image; override the tag to pin a version.
images:
  - name: controller
    newName: ghcr.io/platform-mesh/platform-mesh/platform-mesh-deployer
    newTag: latest
