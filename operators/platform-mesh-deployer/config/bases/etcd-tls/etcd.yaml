apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-ca
spec:
  isCA: true
  commonName: etcd-ca
  secretName: etcd-ca-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: kcp
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: etcd-ca
spec:
  ca:
    secretName: etcd-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-client
spec:
  secretName: etcd-client-tls
  commonName: etcd-client
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: etcd-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  labels:
    app: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.17
          command:
            - etcd
            - --name=etcd
            - --data-dir=/var/lib/etcd
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://etcd:2379
            - --cert-file=/etc/etcd/tls/tls.crt
            - --key-file=/etc/etcd/tls/tls.key
            - --trusted-ca-file=/etc/etcd/tls/ca.crt
            - --client-cert-auth
          ports:
            - name: client
              containerPort: 2379
          volumeMounts:
            - name: tls
              mountPath: /etc/etcd/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            # Populated at runtime by the etcd-server Certificate (needs the sslip.io SAN).
            secretName: etcd-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app: etcd
spec:
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
