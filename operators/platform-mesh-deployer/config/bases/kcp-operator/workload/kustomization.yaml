apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kcp-operator running only its workload controllers (render Deployments etc.
# from Compiled* CRs). Rendered from the fork's main.
resources:
  - github.com/ntnn/kcp-operator/config/default?ref=main

images:
  - name: ghcr.io/kcp-dev/kcp-operator
    newName: ghcr.io/ntnn/kcp-operator
    newTag: split

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kcp-operator-controller-manager
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enabled-controller-groups=workload
