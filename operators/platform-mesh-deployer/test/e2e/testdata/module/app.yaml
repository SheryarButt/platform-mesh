# Payload of the e2e module, packaged as an OCM resource. The deployer
# interpolates ${...} per component instance before applying it, so nothing
# here names the installation: the Module CR the admin applies decides that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${module + "-" + component}
  namespace: ${targetNamespace}
  labels:
    # Read off the component descriptor rather than passed through values.
    e2e.platform-mesh.io/component-version: ${ocm.version}
  annotations:
    # An annotation, not a label: a resource type carries a slash.
    e2e.platform-mesh.io/payload-type: ${ocm.resources.byName("app-manifests").type}
spec:
  replicas: ${values.replicas}
  selector:
    matchLabels:
      app: ${module + "-" + component}
  template:
    metadata:
      labels:
        app: ${module + "-" + component}
    spec:
      containers:
        - name: app
          image: ${values.image}
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            # The ConfigMap the deployer generates for this instance.
            - configMapRef:
                name: ${configMap}
          env:
            - name: PORT
              value: "8443"
            - name: GREETING
              value: ${values.greeting}
            # The kubeconfig the deployer minted for this module, scoped to
            # the module's own kcp workspace.
            - name: KUBECONFIG_PATH
              value: /etc/kcp/kubeconfig
            - name: SECRET_NAMESPACE
              value: ${values.secretNamespace}
            - name: SECRET_NAME
              value: ${values.secretName}
            # The serving certificate the deployer minted so the front proxy
            # can route to this component.
            - name: TLS_CERT_FILE
              value: /etc/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/tls.key
          volumeMounts:
            - name: kcp
              mountPath: /etc/kcp
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
      volumes:
        - name: kcp
          secret:
            secretName: ${kubeconfigSecrets.kcp}
        - name: tls
          secret:
            secretName: ${module + "-" + component + "-serving"}
---
apiVersion: v1
kind: Service
metadata:
  name: ${module + "-" + component}
  namespace: ${targetNamespace}
spec:
  selector:
    app: ${module + "-" + component}
  ports:
    - name: https
      port: 8443
      targetPort: https
