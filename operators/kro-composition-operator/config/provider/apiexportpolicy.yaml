# Shares the kro.run APIExport to org/account workspaces so it is discoverable in
# the Marketplace and bindable by Accounts. Applied into root:orgs (NOT the provider
# workspace).
apiVersion: core.platform-mesh.io/v1alpha1
kind: APIExportPolicy
metadata:
  name: kro.run
spec:
  apiExportRef:
    name: kro.run
    clusterPath: root:providers:kro-provider
  allowPathExpressions:
    - :root:orgs:*
