# Dex — the OIDC issuer for the dev environment. In the RFC 008 `infra`/`core`
# shapes Dex is *the* external issuer kcp authenticates against (see ADR-02), so
# operator development runs without Keycloak/OpenFGA. kcp always needs an OIDC
# issuer wired (spec.auth.oidc on the RootShard), and the deployer refuses to
# create the shard Deployment until the referenced CA secret (dex-ca) exists — so
# Dex ships in the base `infra` profile.
#
# Topology mirrors kcp: the `eg` gateway is TLS-passthrough on the pinned NodePort
# and routes by SNI, so Dex terminates its own TLS with a cert valid for its
# sslip.io name and is reached through the gateway via a TLSRoute. The public
# issuer host is idp.* (not dex.*) so the implementation stays swappable.
# The signing CA is published as the `dex-ca` secret the RootShard's OIDC caFileRef mounts.
#
# __CLUSTER__ and __PORT__ are substituted by the Tiltfile with the cluster ID
# (the node's dashed IP) and the gateway NodePort. They are placeholders rather
# than a fixed hostname because the issuer URL has to resolve to the SAME address
# from two places — the host and the kcp shards verifying tokens — and only a
# sslip.io name does that without hostAliases. A literal here would be a third
# place to keep in sync with the node's IP.
#
# Development-only: in-memory storage, two static test users sharing one password
# (dex/dex, bob/dex), skipApprovalScreen. Do not use as a template for prod.

# --- cert chain -------------------------------------------------------------
# selfsigned (manifests/issuer.yaml) → dex-ca (root) → dex-server (leaf).
# kcp trusts dex-ca's ca.crt; Dex serves dex-server, signed by dex-ca.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-ca
  namespace: platform-mesh-system
spec:
  isCA: true
  commonName: dex-ca
  secretName: dex-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dex-ca
  namespace: platform-mesh-system
spec:
  ca:
    secretName: dex-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-server
  namespace: platform-mesh-system
spec:
  secretName: dex-server
  dnsNames:
    - idp.__CLUSTER__.sslip.io
    - dex
    - dex.platform-mesh-system
    - dex.platform-mesh-system.svc
    - dex.platform-mesh-system.svc.cluster.local
  issuerRef:
    name: dex-ca
    kind: Issuer
    group: cert-manager.io
---
# --- dex config -------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: platform-mesh-system
data:
  config.yaml: |
    issuer: https://idp.__CLUSTER__.sslip.io:__PORT__
    storage:
      type: memory
    web:
      https: 0.0.0.0:5556
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
    telemetry:
      http: 0.0.0.0:5558
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: platform-mesh
        name: Platform Mesh
        public: true
        redirectURIs:
          - http://localhost:8000
          - http://127.0.0.1:8000
    enablePasswordDB: true
    # Test identities. All share the password `dex` — the same bcrypt hash, which
    # is safe to reuse here because this file only ever runs against a local Tilt
    # cluster and the credential is printed in the README.
    #
    # userID is what ends up in the `sub` claim, and `sub` is half of what a User's
    # metadata.name hashes (sha256(issuer + "\n" + sub)). So these must be STABLE
    # and DISTINCT: changing one orphans that identity's User and everything keyed
    # to it, and reusing one would make two logins resolve to a single User.
    #
    # `groups` needs dex >= 2.45.0 (dexidp/dex#4456). Before that the builtin
    # password connector emitted no groups at all, whatever the config said — so a
    # downgrade of the image below does not degrade group testing, it silently
    # removes it, and the symptom is an empty `groups` claim rather than an error.
    #
    # They reach a token only when the client asks for the `groups` scope, so a
    # client that wants group-based authorization has to request it explicitly.
    staticPasswords:
      # email: dex@pm.localhost, password: dex
      #
      # In two groups on purpose. `platform-admins` is one NOBODY ELSE is in —
      # what a group-based platform-admin check would key on, where the whole
      # point is that holding it is not the same as being authenticated.
      - email: dex@pm.localhost
        username: dex
        userID: "00000000-0000-0000-0000-000000000001"
        hash: "$2a$10$AuO2zT4bk2xn1RXP23XqhO5BMo5PoJFs6tv4MUrKk/mtv97DSNoAC"
        groups:
          - platform-admins
          - acme-engineering
      # email: bob@pm.localhost, password: dex
      #
      # A second identity, for the flows that need someone to grant access TO:
      # `memberships add`, self-leave, the last-admin guard, and 404-not-403 —
      # none of which can be exercised with one user, because a single identity is
      # always a member of everything it can see.
      #
      # SHARES `acme-engineering` with dex@ and holds nothing else. That overlap is
      # the interesting one: it is what makes "one grant, two people" observable,
      # and what makes a group grant distinguishable from a per-user one — the two
      # look identical until a second member appears without a second Membership.
      - email: bob@pm.localhost
        username: bob
        userID: "00000000-0000-0000-0000-000000000002"
        hash: "$2a$10$AuO2zT4bk2xn1RXP23XqhO5BMo5PoJFs6tv4MUrKk/mtv97DSNoAC"
        groups:
          - acme-engineering
---
# --- dex deployment ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: platform-mesh-system
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          # >= 2.45.0 is a REQUIREMENT, not a currency preference: groups on
          # staticPasswords landed there (dexidp/dex#4456), and an older image
          # accepts the same config while issuing tokens with no groups claim.
          image: ghcr.io/dexidp/dex:v2.45.1
          command: ["dex", "serve", "/etc/dex/config/config.yaml"]
          ports:
            - name: https
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          volumeMounts:
            - name: config
              mountPath: /etc/dex/config
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tls
          secret:
            secretName: dex-server
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: platform-mesh-system
  labels:
    app: dex
spec:
  selector:
    app: dex
  ports:
    - name: https
      port: 5556
      targetPort: https
---
# --- gateway route (SNI idp.<cluster>.sslip.io → dex, TLS passthrough) -------
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: dex
  namespace: platform-mesh-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: envoy-gateway-system
      sectionName: passthrough
  hostnames:
    - idp.__CLUSTER__.sslip.io
  rules:
    - backendRefs:
        - name: dex
          port: 5556
